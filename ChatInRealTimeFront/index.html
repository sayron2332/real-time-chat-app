<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Головна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/chat.css">
</head>

<body>
    <div class="chat-container">
        
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <span class="navbar-brand">💬 Чат</span>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="currentUserDisplay"></span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">Вийти</button>
                </div>
            </div>
        </nav>

       
        <div class="messages-container p-3" id="messagesContainer">
            <div class="system-message" id="welcomeMessage">
                Ласкаво просимо до чату! 🎉
            </div>
        </div>

       
        <div class="border-top bg-white p-3">
            <div class="input-group">
                <input type="text" class="form-control" id="messageInput" placeholder="Напишіть повідомлення..."
                    autocomplete="off">
                <button class="btn btn-primary" onclick="sendMessage()">Надіслати</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
</body>

</html>
