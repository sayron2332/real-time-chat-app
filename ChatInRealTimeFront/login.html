<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Чат</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="auth-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Вхід</h2>
                        <p class="text-muted">Увійдіть у свій акаунт</p>
                    </div>


                    <div class="alert alert-danger d-none" id="loginGeneralError"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                            <div class="invalid-feedback" id="loginEmailError"></div>
                        </div>

                        <div class="mb-4">
                            <label for="loginPassword" class="form-label">Пароль *</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                            <div class="invalid-feedback" id="loginPasswordError"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                            Увійти
                        </button>

                        <div class="text-center">
                            <p class="mb-0">Немає акаунта?
                                <a href="register.html" class="text-decoration-none">Зареєструватися</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
